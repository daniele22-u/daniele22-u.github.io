  <script>
    // percorso richiesto, mostrato nella barra
    document.getElementById('path').textContent = location.pathname.slice(0, 48);

    // tracce EEG che degenerano in una linea piatta, con qualche spike residuo
    const cv = document.getElementById('c'), ctx = cv.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W, H;
    function fit() {
      const dpr = Math.min(devicePixelRatio || 1, 2), r = cv.getBoundingClientRect();
      W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      const n = W < 600 ? 6 : 9, gap = H / (n + 1);
      ctx.lineWidth = 1;
      for (let c = 0; c < n; c++) {
        const y0 = gap * (c + 1);
        ctx.strokeStyle = css('--trace');
        ctx.beginPath();
        for (let x = 0; x <= W; x += 2) {
          const tau = t - (W - x) / 120;
          // l'ampiezza decade verso destra: il segnale "muore"
          const decay = Math.max(0, 1 - x / (W * 0.55));
          let v = decay * (Math.sin(tau * 9 + c) * 0.6 + Math.sin(tau * 23 + c * 2) * 0.3 + Math.sin(tau * 3.1 + c) * 0.5);
          const spike = Math.exp(-Math.pow(((tau + c * 0.7) % 4) - 2, 2) * 400) * 1.8;
          v += x > W * 0.55 ? spike * 0.6 : 0;
          const y = y0 + v * gap * 0.32;
          x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.stroke();
      }
    }
    fit();
    addEventListener('resize', () => { fit(); draw(performance.now() / 1000); });
    if (reduce) draw(2);
    else (function loop(ts) { draw(ts / 1000); requestAnimationFrame(loop); })(0);
  </script>
